<svg viewBox="0 0 1000 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The old way beside ours, with ours stacked ten deep"><text x="30" y="32" text-anchor="start" font-family="Satoshi, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#7E8E84" opacity="1">THE OLD WAY</text>
