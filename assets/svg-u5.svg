<text x="30" y="176" text-anchor="start" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#7E8E84" opacity="1">Thirty times over, to be spread out.</text>
<text x="30" y="206" text-anchor="start" font-family="Cormorant Garamond, serif" font-size="19" font-style="italic" fill="#7E8E84" opacity="1">Almost nobody can.</text>
