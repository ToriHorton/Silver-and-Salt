<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One hundred women times one thousand dollars equals one hundred thousand into one company, times ten a year equals one million dollars">
<text x="60" y="90" text-anchor="start" font-family="Cormorant Garamond, serif" font-size="34" font-style="normal" fill="#2F3E34">100 women</text>
<text x="60" y="128" text-anchor="start" font-family="Cormorant Garamond, serif" font-size="26" font-style="normal" fill="#7E8E84">x $1,000 each</text>
