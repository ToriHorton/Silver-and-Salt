<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | Silver & Salt Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <!-- Full @odla-ai/ui 0.16.0 stylesheet: covers the DataTable/MetricWidget/
       StatBand/StepPipeline used by the Dashboard AND the @odla-ai/crm UI
       (StageControl, TagEditor, Combobox, ActivityFeed). The inline <style>
       below loads AFTER this link, so the page's brand overrides of any shared
       generic class (.card/.tabs/.spinner) win. -->
  <link rel="stylesheet" href="/assets/odla-ui/odla-ui.css?v=5">
  <!-- Phase 5: the ChapterAdmin island's own stylesheet, extracted by Vite from
       the theme + component + CRM imports in src/app/admin/index.jsx (salt
       scope.css, @odla-ai/ui/index.css, @odla-ai/crm/ui.css). ChapterAdmin
       checks at runtime that a .panel has a background and renders a loud red
       banner if this layer is missing, so this link is load-bearing. It sits
       BEFORE the inline <style> below so the page's brand overrides still win. -->
  <link rel="stylesheet" href="/assets/app/admin.css?v=2">
  <style>
    /* Brand numeral override (styles.css section 0 / BRAND.md): digits 0-9
       always render in Cormorant Infant wherever Cormorant Garamond is
       requested. Standalone pages must carry this block themselves. */
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 600; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyJU44g9vKiM1sORYSiWeAsLN997_Il2xMEbK0UPg.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyJU44g9vKiM1sORYSiWeAsLN997_Il2xMEbK0UPg.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 600; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyJU44g9vKiM1sORYSiWeAsLN997_Il2xMEbK0UPg.woff2) format('woff2'); unicode-range: U+0030-0039; }

    /* Styling follows join.html (the design reference): moss hero, white
       cards on the soft green field, lime primary actions. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }

    :root {
      --cream:      #FBF8F2;
      --moss:       #2F3E34;
      --moss-light: #4A5E50;
      --sage:       #7E8E84;
      --lime:       #7CB83F;
      --lime-dark:  #6aa535;
      --lime-soft:  rgba(124, 184, 63, 0.12);
      --border:     #d6e8d2;
      --bg:         #eef4ea;
    }

    body {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--moss);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 80px;
    }

    .container { width: 100%; max-width: 960px; padding: 0 20px; }

    /* ── Hero (compact variant for the console) ── */
    .hero {
      width: 100%;
      max-width: 100vw;
      background: var(--moss);
      text-align: center;
      padding: 56px 40px 44px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--lime) 50%, transparent 100%);
    }

    .back-link {
      position: absolute;
      top: 20px;
      right: 28px;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--cream); }

    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-bottom: 18px;
    }
    .brand-amp { font-family: 'Cormorant Garamond', Georgia, serif; font-style: normal; }

    .hero h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 300;
      font-style: italic;
      color: #fff;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--lime);
      border: 1px solid rgba(124,184,63,0.35);
      border-radius: 100px;
      padding: 5px 16px;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 36px;
      overflow: visible;
      margin-bottom: 24px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 22px;
    }

    .auth-status {
      font-size: 14px;
      color: var(--sage);
      text-align: center;
      padding: 24px 0;
      line-height: 1.8;
    }
    .auth-status a { color: var(--lime-dark); font-weight: 700; text-decoration: none; }
    .auth-status a:hover { text-decoration: underline; }

    #signin-mount {
      display: flex;
      justify-content: center;
      overflow: visible;
    }

    /* ── @odla-ai/ui components (tabs, calendar): tokens mapped to the brand ── */
    :root {
      --ui-space-1: 4px;
      --ui-space-2: 8px;
      --ui-space-3: 12px;
      --ui-space-4: 16px;
      --ui-border: var(--border);
      --ui-border-strong: #b9cdb4;
      --ui-text: var(--moss);
      --ui-text-lg: 16px;
      --ui-text-md: 14px;
      --ui-text-sm: 13px;
      --ui-text-xs: 11px;
      --ui-text-muted: var(--sage);
      --ui-text-faint: #9aa79e;
      --ui-tracking-caps: 0.08em;
      --ui-focus: 0 0 0 3px var(--lime-soft);
      --ui-radius-sm: 4px;
      --ui-radius-md: 8px;
      --ui-radius-lg: 12px;
      --ui-radius-pill: 100px;
      --ui-accent: var(--lime);
      --ui-accent-strong: var(--lime-dark);
      --ui-accent-soft: var(--lime-soft);
      --ui-on-accent: #ffffff;
      --ui-danger: #a4442c;
      --ui-good: var(--lime-dark);
      /* Metric-graph color alignment. The line strokes in --ui-chart-1
         (=--ui-accent, our lime); positive hover dots + delta swatches use
         --ui-chart-pos (defaults to --ui-good). odla-ai/ui's own theme makes
         accent a blue and good a green, so the two read as a deliberate
         line-vs-direction cue. Our brand has one green, so good=lime-dark
         landed as a near-identical second green on the lime line, which reads
         as a mismatch. Pin the chart's positive to the line color: a rising
         series is one coherent lime; negatives stay --ui-danger (red). */
      --ui-chart-pos: var(--ui-accent);
      /* Metric hover tooltip: adopts @odla-ai/ui 0.8.2's themed default
         (--ui-chart-tip-bg = --ui-surface, text = --ui-text, now with a
         --ui-border-strong border + --ui-shadow-strong lift), which resolves
         to a white card with moss text on our theme. This replaced our earlier
         moss/cream override once the upstream tooltip stopped using a
         semi-transparent fill. Re-pin here only if the light tooltip ever
         reads poorly. */
      --ui-space-6: 24px;
      --ui-shadow: 0 8px 24px rgba(47, 62, 52, 0.12);
      --ui-surface: #ffffff;
      --ui-surface-2: #f4faf2;
    }

    /* DataTable chrome, pinned to this console's existing table look: same
       header treatment and cell rhythm as the hand-rolled tables, no height
       cap or sticky tint (the page scrolls, tables never did). */
    .data-table .table { font-size: 14px; }
    .data-table .table th, .data-table .table-sort {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 11px;
      font-weight: 700;
      color: var(--sage);
      white-space: nowrap;
    }
    .data-table .table th { padding: 10px 14px 10px 0; }
    .data-table .table th.sortable { padding: 0; }
    .data-table .table-sort { padding: 10px 14px 10px 0; }
    .data-table .table td {
      padding: 12px 14px 12px 0;
      color: var(--moss-light);
      vertical-align: middle;
      white-space: nowrap;
    }
    .data-table .table-wrap { max-height: none; overflow-x: auto; }
    .data-table .table thead th { position: static; background: transparent; }
    .data-table .cell-person { color: var(--moss); font-weight: 500; }
    .data-table .table-filter {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
    }
    .tabs { margin-bottom: 24px; }
    .tabs button {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 12px;
    }

    /* ── Console header row ── */
    .console-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .member-email { font-size: 15px; font-weight: 500; color: var(--moss); }
    .signout-btn {
      background: none;
      border: none;
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sage);
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .signout-btn:hover { color: var(--moss); text-decoration: underline; }

    /* ── Stats ── */
    .stats-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat {
      flex: 1;
      min-width: 140px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .stat-num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 34px;
      color: var(--moss);
      line-height: 1.1;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sage);
      margin-top: 4px;
    }

    /* ── People table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sage);
      padding: 10px 14px 10px 0;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 12px 14px 12px 0;
      border-bottom: 1px solid var(--border);
      color: var(--moss-light);
      vertical-align: middle;
      white-space: nowrap;
    }
    td.person { color: var(--moss); font-weight: 500; }
    td .muted { color: var(--sage); font-size: 13px; }

    select, input[type="datetime-local"] {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      color: var(--moss);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 8px;
      background: #fff;
    }
    select:focus, input[type="datetime-local"]:focus { outline: 2px solid var(--lime-soft); border-color: var(--lime); }
    select:disabled { color: var(--sage); background: #f6f8f5; }

    .row-save {
      background-color: var(--lime);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .row-save:hover { background-color: var(--lime-dark); }
    .row-save:disabled { background-color: #b0cc9e; cursor: default; }

    .row-approve {
      background-color: var(--moss);
      color: var(--cream);
    }
    .row-approve:hover { background-color: var(--moss-light); }
    .row-refund {
      background: none;
      border: 1px solid #d9b3a6;
      color: #a4442c;
    }
    .row-refund:hover { background: #fbf0ec; }
    .row-actions { display: flex; gap: 6px; align-items: center; }

    .pay-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 100px;
      padding: 4px 12px;
    }
    .pay-badge.paid { color: #fff; background: var(--lime); }
    .pay-badge.refunded { color: #a4442c; background: #fbf0ec; border: 1px solid #d9b3a6; }
    .pay-badge.unpaid { color: var(--sage); background: #eef2ec; border: 1px solid #dde5da; }
    .pay-renewal { font-size: 12px; color: var(--sage); margin-left: 6px; }

    .cell-sub { display: block; font-size: 12px; color: var(--sage); margin-top: 3px; }

    /* ── Availability form ── */
    .avail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px 24px;
      margin-bottom: 6px;
    }
    .avail-grid select, .avail-grid input[type="number"] {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      color: var(--moss);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      width: 100%;
    }
    .avail-days { display: flex; flex-wrap: wrap; gap: 6px; }
    .avail-day {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--sage);
      background: #fff; border: 1px solid var(--border); border-radius: 100px;
      padding: 7px 12px; cursor: pointer;
    }
    .avail-day[aria-pressed="true"] { background: var(--lime); color: #fff; border-color: var(--lime); }

    /* Inline reschedule picker (compact twin of the join page picker). */
    .resched-cell { background: #f8fbf6; padding: 16px 12px; }
    .resched-days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
    .resched-day {
      flex: 0 0 auto;
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--moss-light);
      background: #fff; border: 1px solid var(--border); border-radius: 100px;
      padding: 6px 12px; cursor: pointer; white-space: nowrap;
    }
    .resched-day[aria-pressed="true"] { background: var(--moss); color: #fff; border-color: var(--moss); }
    .resched-times { display: flex; flex-wrap: wrap; gap: 6px; }
    .resched-time {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px; font-weight: 500; color: var(--moss);
      background: #fff; border: 1px solid var(--border); border-radius: 4px;
      padding: 7px 10px; cursor: pointer;
    }
    .resched-time:hover { border-color: var(--lime); background: var(--lime-soft); }
    .resched-note { font-size: 12px; color: var(--sage); margin-top: 10px; }

    .empty-note { font-size: 14px; color: var(--sage); line-height: 1.8; }

    /* ── Loading ── */
    @keyframes ssc-spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: ssc-spin 0.7s linear infinite;
      vertical-align: -3px;
    }
    .loading-note {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--sage);
      padding: 14px 0;
    }

    /* ── Email preview ── */
    .tpl-preview-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sage);
      margin: 2px 0 6px;
    }
    .email-preview {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfaf5;
      padding: 14px 16px;
    }
    .email-meta { font-size: 11px; color: var(--sage); margin-bottom: 8px; }
    .email-subject { font-size: 14px; font-weight: 700; color: var(--moss); margin-bottom: 10px; }
    .email-body {
      font-size: 13px;
      color: var(--moss-light);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Email template editor ── */
    .tpl-block { margin-bottom: 22px; }
    .tpl-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--moss);
      margin-bottom: 8px;
    }
    .tpl-hint {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      color: var(--sage);
    }
    .tpl-block input[type="text"], .tpl-block textarea {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: var(--moss);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      width: 100%;
      margin-bottom: 8px;
      resize: vertical;
      line-height: 1.6;
    }
    .tpl-block input:focus, .tpl-block textarea:focus {
      outline: 2px solid var(--lime-soft);
      border-color: var(--lime);
    }
    .tpl-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 2px 0 10px;
    }
    .tpl-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--moss);
      cursor: pointer;
    }
    .tpl-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--lime);
      cursor: pointer;
      margin: 0;
    }
    .tpl-test-note { font-size: 12px; color: var(--sage); }

    /* ── Calendar tab (view switcher, by-user sections, detail panel) ── */
    .cal-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .cal-month-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--moss);
      margin-left: 10px;
      align-self: center;
    }
    /* Out-of-sync meetings, loud in every view (flagged, never adopted). */
    .cal-attention {
      border-left: 3px solid #a4442c;
      background: #fbf0ec;
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .cal-attention-head {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a4442c;
      margin-bottom: 4px;
    }
    .cal-attention .cal-person-row { border-bottom-color: #ecd9d2; }
    .cal-attention .cal-person-row:last-child { border-bottom: none; }
    .cal-attention .cal-person-row:hover { background: rgba(164, 68, 44, 0.06); }

    .cal-person-section { margin-top: 18px; }
    .cal-person-head {
      font-size: 13px;
      font-weight: 700;
      color: var(--moss);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .cal-person-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: var(--moss);
      text-align: left;
      padding: 10px 2px;
      cursor: pointer;
    }
    .cal-person-row:hover { background: var(--lime-soft); }
    .cal-row-past { color: var(--sage); }
    .cal-detail {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-top: 18px;
      background: #fbfaf5;
    }
    .cal-detail-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .cal-detail-when { font-size: 15px; font-weight: 500; color: var(--moss); margin-top: 8px; }
    .send-status { font-size: 12px; }
    .send-status.ok { color: var(--lime-dark, #5a7d3f); }
    .send-status.fail { color: #a4442c; }

    .hidden { display: none; }

    /* ── People (CRM) tab: record drawer, lifecycle bar, email composer ── */
    /* Keep a wide people table scrolling INSIDE its card instead of bleeding
       off the page (the odla-ui DataTable has no scroll container of its own). */
    .crm-list-wrap { overflow-x: auto; }
    .crm-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    /* People: full-width, two-pane master/detail (a left exploration rail and a
       docked detail pane on the right). The 100vw breakout escapes the 960px
       .container; body has overflow-x:hidden so it never adds a scrollbar. */
    .people-full { width: 100vw; position: relative; left: 50%; margin-left: -50vw; padding: 0 32px; }
    .people-stats { margin-bottom: 24px; }
    .people-grid { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; gap: 24px; align-items: start; }
    .people-rail, .people-detail { min-width: 0; }
    .people-detail { position: sticky; top: 20px; }
    .people-empty { color: var(--sage); }
    .people-empty p { margin-top: 6px; font-size: 15px; line-height: 1.5; }
    @media (max-width: 1024px) {
      .people-full { width: auto; left: auto; margin-left: 0; padding: 0; }
      .people-grid { grid-template-columns: 1fr; }
      .people-detail { position: static; }
    }
    /* The detail-pane header (title + Close). */
    .crm-drawer-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 14px; margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    /* CRM name cells render as a bare <button class="crm-record-open"> with no
       CSS of their own; style them as clean text links, not browser buttons. */
    .crm-record-open {
      border: 0; background: none; padding: 0; margin: 0;
      font: inherit; font-weight: 600; color: var(--moss);
      cursor: pointer; text-align: left;
    }
    .crm-record-open:hover { color: var(--lime-dark); text-decoration: underline; }

    /* Exploration rail: search + stage chips + role-styled, active-highlighted list. */
    .rail-search { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 14px; color: var(--moss); margin-bottom: 12px; }
    .rail-stages { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .rail-chip { border: 1px solid var(--border); background: #fff; border-radius: 100px; padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 600; color: var(--sage); cursor: pointer; }
    .rail-chip.on { background: var(--moss); color: var(--cream); border-color: var(--moss); }
    .rail-list { list-style: none; margin: 0; padding: 0; }
    .rail-row { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 10px 12px; margin-bottom: 2px; cursor: pointer; font: inherit; }
    .rail-row:hover { background: var(--bg); }
    .rail-row.active { background: var(--lime-soft); box-shadow: inset 3px 0 0 var(--lime); }
    .rail-row-top { display: flex; align-items: center; gap: 8px; }
    .rail-name { font-weight: 600; color: var(--moss); }
    .rail-name.role-admin { color: var(--lime-dark); }
    .role-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 100px; padding: 2px 8px; }
    .role-badge.admin { background: var(--lime); color: #fff; }
    .role-badge.member { background: var(--lime-soft); color: var(--moss-light); }
    .rail-sub { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 2px; margin-top: 3px; }
    .rail-email { font-size: 12px; color: var(--sage); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .rail-status { font-size: 12px; font-weight: 600; color: var(--moss-light); white-space: nowrap; }
    .rail-pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--sage); }
    .rail-pager button { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12px; color: var(--moss); cursor: pointer; }
    .rail-pager button:disabled { opacity: 0.45; cursor: default; }
    .rail-note { padding: 16px 4px; color: var(--sage); font-size: 14px; }

    /* Dashboard metric widgets (@odla-ai/ui MetricWidget). */
    .dash-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; align-items: start; }
    .dash-metrics > .card, .dash-metrics > .metric { margin-bottom: 0; }
    .metric { border: 1px solid var(--border); border-radius: 8px; }
    @media (max-width: 720px) { .dash-metrics { grid-template-columns: 1fr; } }
    /* Full-width revenue trend + caption. */
    .dash-revenue { margin-bottom: 24px; }
    .dash-revenue > .metric { margin-bottom: 0; }
    .dash-revenue-note { margin: 10px 2px 0; }
    /* Pipeline funnel: large count in the circle + weekly delta beneath. */
    .pipe-count { font-size: 28px; font-weight: 700; color: var(--moss); line-height: 1; }
    .pipe-delta { color: var(--lime-dark); font-weight: 700; font-size: 12px; }
    .pipe-delta-zero { color: var(--sage); font-size: 12px; }

    /* Dashboard upcoming-calls agenda. */
    .dash-agenda { list-style: none; margin: 0; padding: 0; }
    .dash-agenda-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .dash-agenda-row:last-child { border-bottom: 0; }
    .dash-agenda-when { font-weight: 600; color: var(--moss); font-size: 14px; min-width: 210px; }
    .dash-agenda-who { color: var(--moss-light); font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-agenda-link { color: var(--lime-dark); font-weight: 700; text-decoration: none; font-size: 12px; }
    .dash-agenda-link:hover { text-decoration: underline; }

    /* Record detail sub-tabs (Info / Comms / Comms history / Scheduling / Billing / Notes). */
    .rec-tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .rec-tab { border: 0; background: none; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 600; color: var(--sage); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .rec-tab:hover { color: var(--moss); }
    .rec-tab.on { color: var(--moss); border-bottom-color: var(--lime); }
    .rec-info > * { margin-bottom: 18px; }
    .rec-info > *:last-child { margin-bottom: 0; }
    .rec-when { font-size: 16px; font-weight: 600; color: var(--moss); margin-bottom: 12px; }
    .rec-log { list-style: none; margin: 0; padding: 0; }
    .rec-log-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .rec-log-row:last-child { border-bottom: 0; }
    .rec-log-head { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; }
    button.rec-log-head.expandable { cursor: pointer; }
    button.rec-log-head.expandable:hover .rec-log-subj { color: var(--lime-dark); }
    .rec-log-subj { display: block; font-weight: 600; color: var(--moss); font-size: 14px; }
    .rec-log-meta { display: block; font-size: 12px; color: var(--sage); margin-top: 2px; }
    .rec-log-caret { display: inline-block; width: 12px; margin-right: 6px; color: var(--sage); transition: transform 0.15s; }
    .rec-log-caret.open { transform: rotate(90deg); }
    /* Expanded email body: the plaintext as sent, wrapped in the brand font. */
    .rec-log-body { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 13px; line-height: 1.65; color: var(--moss-light); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin: 10px 0 2px; }
    /* Calendar (Google) entries: a lime rule to set them apart from emails. */
    .rec-log-cal { padding-left: 12px; box-shadow: inset 3px 0 0 var(--lime-soft); }
    .rec-log-cal .rec-log-subj { color: var(--moss-light); }

    /* ── @odla-ai/crm UI: the package ships crm-* wrapper classes with NO CSS,
       so style its form controls + components to the brand. Form elements are
       targeted by tag inside the wrappers (robust regardless of odla-ui's own
       classes); primary action buttons get the lime treatment. ── */
    .crm-activity-composer, .crm-fields-form { display: flex; flex-direction: column; gap: 10px; }
    .crm-activity-composer input, .crm-activity-composer textarea,
    .crm-fields-form input, .crm-fields-form textarea, .crm-fields-form select,
    .crm-stage-control select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
      font: inherit; font-size: 14px; color: var(--moss); background: #fff;
    }
    .crm-activity-composer textarea, .crm-fields-form textarea { resize: vertical; min-height: 80px; }
    .crm-activity-composer input:focus, .crm-activity-composer textarea:focus,
    .crm-fields-form input:focus, .crm-fields-form textarea:focus, .crm-fields-form select:focus,
    .crm-stage-control select:focus, .crm-tag-editor input:focus {
      outline: none; border-color: var(--lime); box-shadow: var(--ui-focus);
    }
    .crm-activity-task-row { display: flex; gap: 10px; }
    .crm-activity-task-row > * { flex: 1; margin: 0; }
    /* primary action buttons: Add / Save profile / Move (brand lime) */
    .crm-activity-composer > button, .crm-activity-composer > .btn,
    .crm-fields-form > button, .crm-fields-form > .btn,
    .crm-stage-control button, .crm-stage-control .btn {
      align-self: flex-start; border: 0; border-radius: 100px; background: var(--lime);
      color: #fff; font: inherit; font-size: 13px; font-weight: 700; padding: 9px 20px; cursor: pointer;
    }
    .crm-activity-composer > button:hover, .crm-fields-form > button:hover, .crm-stage-control button:hover { background: var(--lime-dark); }
    .crm-activity-composer > button:disabled, .crm-fields-form > button:disabled, .crm-stage-control button:disabled { opacity: 0.5; cursor: default; }
    /* activity feed list */
    .crm-activity-list { list-style: none; margin: 18px 0 0; padding: 0; }
    .crm-activity-list > li { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .crm-activity-list > li:last-child { border-bottom: 0; }
    .crm-activity-meta { display: block; font-size: 12px; color: var(--sage); margin-top: 2px; }
    /* stage control */
    .crm-stage-control { align-items: flex-start; }
    .crm-stage-current { font-size: 15px; font-weight: 600; color: var(--moss); }
    .crm-stage-row { display: flex; gap: 10px; align-items: center; width: 100%; }
    .crm-stage-row select { flex: 1; }
    /* tags */
    .crm-tag-editor { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .crm-tag-editor input { flex: 1; min-width: 140px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 14px; color: var(--moss); }
    .crm-tag-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--lime-soft); color: var(--moss); border-radius: 100px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
    .crm-tag-remove { border: 0; background: none; color: var(--sage); cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
    .crm-tag-remove:hover { color: #a4442c; }
    /* facet cards (identity / billing / channels) */
    .crm-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
    .crm-card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sage); margin-bottom: 10px; }
    .crm-card-facts { display: grid; gap: 6px; font-size: 14px; color: var(--moss); }
    .crm-card-empty { color: var(--sage); font-size: 14px; }
    .crm-badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 100px; padding: 2px 10px; background: var(--lime-soft); color: var(--moss-light); }
    .crm-drawer-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 400; color: var(--moss); }
    .crm-lifecycle { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .crm-stage-chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--moss-light); background: var(--lime-soft); border: 1px solid var(--border); border-radius: 100px; padding: 5px 14px; }
    .crm-error { color: #a4442c; font-size: 13px; }

    .card-inner { border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; background: #fff; }
    .crm-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .crm-seg button { border: 0; background: #fff; padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--sage); cursor: pointer; }
    .crm-seg button.on { background: var(--moss); color: var(--cream); }
    .crm-field { display: block; margin-bottom: 12px; }
    .crm-field > span { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sage); margin-bottom: 5px; }
    .crm-field input, .crm-field select, .crm-field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; color: var(--moss); background: #fff; }
    .crm-field textarea { resize: vertical; }
    .crm-consent-note { font-size: 12px; color: var(--moss-light); background: var(--lime-soft); border-radius: 8px; padding: 8px 12px; margin: 6px 0 12px; }
    .crm-email-actions { display: flex; align-items: center; gap: 12px; }
    .crm-email-result { font-size: 13px; color: var(--moss-light); }

    @media (max-width: 480px) {
      .hero { padding: 48px 24px 40px; }
      .back-link { position: static; display: block; text-align: left; margin-bottom: 20px; }
      .card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <div class="hero">
    <a href="/members/" class="back-link">← Member area</a>
    <div class="wordmark">Silver <span class="brand-amp">&amp;</span> Salt Capital</div>
    <h1>Admin Console</h1>
    <span class="tag">Internal</span>
  </div>

  <div class="container">

    <div class="card" id="status-card">
      <div class="card-label">Admin</div>
      <div class="auth-status" id="auth-loading"><span class="spinner"></span> Preparing sign in…</div>
    </div>

    <div id="signin-mount" class="hidden"></div>

    <!-- The console renders here (src/app/admin/, Preact via the Vite
         build in _scripts/build-site.sh); markup and classes match the
         previous inline version so the CSS above applies unchanged. -->
    <div id="console-root" class="hidden"></div>

  </div>

  <script src="/assets/member-auth.js?v=4"></script>
  <script type="module" src="/assets/app/admin.js?v=22"></script>
</body>
</html>
