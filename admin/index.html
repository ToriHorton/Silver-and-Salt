<!DOCTYPE html>
<!-- data-ui-theme/data-ui-accent put the salt theme's token VALUES on the
     document root, and data-theme="light" stops @odla-ai/ui's
     prefers-color-scheme dark block from applying there. Both matter because
     ChapterAdmin themes the Clerk widget with clerkAppearanceFromTokens(),
     which reads the ROOT rather than its own [data-chapter-admin] scope; on a
     dark-mode machine the sign-in card would otherwise render dark with a
     blue button. -->
<html lang="en" data-ui-theme="salt" data-ui-accent="lime" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | Silver & Salt Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <!-- The console's component CSS (salt theme layer, @odla-ai/ui, @odla-ai/crm)
       is imported by src/app/admin.jsx and emitted as one bundled sheet. The
       inline <style> below still owns the page chrome: hero, card, wordmark,
       and the numeral override. -->
  <link rel="stylesheet" href="/assets/app/admin.css?v=1">
  <style>
    /* Brand numeral override (styles.css section 0 / BRAND.md): digits 0-9
       always render in Cormorant Infant wherever Cormorant Garamond is
       requested. Standalone pages must carry this block themselves. */
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 600; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyPU44g9vKiM1sORYSiWeAsLN997_cV2RkDTq8.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyJU44g9vKiM1sORYSiWeAsLN997_Il2xMEbK0UPg.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyJU44g9vKiM1sORYSiWeAsLN997_Il2xMEbK0UPg.woff2) format('woff2'); unicode-range: U+0030-0039; }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 600; font-display: swap; src: url(https://fonts.gstatic.com/s/cormorantinfant/v22/HhyJU44g9vKiM1sORYSiWeAsLN997_Il2xMEbK0UPg.woff2) format('woff2'); unicode-range: U+0030-0039; }

    /* Styling follows join.html (the design reference): moss hero, white
       cards on the soft green field, lime primary actions. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }

    :root {
      --cream:      #FBF8F2;
      --moss:       #2F3E34;
      --moss-light: #4A5E50;
      --sage:       #7E8E84;
      --lime:       #7CB83F;
      --lime-dark:  #6aa535;
      --lime-soft:  rgba(124, 184, 63, 0.12);
      --border:     #d6e8d2;
      --bg:         #eef4ea;
    }

    body {
      font-family: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--moss);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 80px;
    }

    .container { width: 100%; max-width: 960px; padding: 0 20px; }

    /* ── Hero (compact variant for the console) ── */
    .hero {
      width: 100%;
      max-width: 100vw;
      background: var(--moss);
      text-align: center;
      padding: 56px 40px 44px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--lime) 50%, transparent 100%);
    }

    .back-link {
      position: absolute;
      top: 20px;
      right: 28px;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--cream); }

    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-bottom: 18px;
    }
    .brand-amp { font-family: 'Cormorant Garamond', Georgia, serif; font-style: normal; }

    .hero h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 300;
      font-style: italic;
      color: #fff;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--lime);
      border: 1px solid rgba(124,184,63,0.35);
      border-radius: 100px;
      padding: 5px 16px;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 36px;
      overflow: visible;
      margin-bottom: 24px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 22px;
    }

    .auth-status {
      font-size: 14px;
      color: var(--sage);
      text-align: center;
      padding: 24px 0;
      line-height: 1.8;
    }
    .auth-status a { color: var(--lime-dark); font-weight: 700; text-decoration: none; }
    .auth-status a:hover { text-decoration: underline; }

    /* Clerk renders its own card inside the console; keep overflow visible so
       the widget's labels are not clipped. */
    #console-root { overflow: visible; }

    /* Clerk sign-in theming.
       ChapterAdmin themes the widget with clerkAppearanceFromTokens(), which
       reads getComputedStyle(document.documentElement), NOT its own
       [data-chapter-admin] scope where BrandStyle writes these values. The salt
       theme attributes on <html> supply the marketing palette (sand and rust),
       so pin the app-surface values the console actually uses. These are the
       exact custom properties that function reads; nothing else belongs here.
       Remove once clerkAppearanceFromTokens reads the chapter-admin scope. */
    :root {
      --ui-accent: var(--lime);
      --ui-on-accent: #ffffff;
      --ui-surface: #ffffff;
      --ui-surface-2: #f4faf2;
      --ui-text: var(--moss);
      --ui-text-muted: var(--sage);
      --ui-border: var(--border);
      --ui-danger: #a4442c;
      --ui-good: var(--lime-dark);
      --ui-radius-md: 4px;
      --ui-font-sans: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;
      --ui-shadow: 0 8px 24px rgba(47, 62, 52, 0.12);
    }

    /* ChapterAdmin's signed-out gate renders a badge, wordmark, and tagline
       above the Clerk widget. This page already has a masthead carrying all
       three, so the gate's copy shows the brand twice. Hide just that block,
       matched by the gate wrapper that contains the Clerk root so the rule
       cannot reach the signed-in console. */
    [data-chapter-admin] > div > div:has(> .cl-rootBox) > div:first-child {
      display: none;
    }

    /* The gate is styled for a page chapter owns outright: 100vh tall, centred,
       with its own radial wash. Under this page's hero that reads as a second
       full-screen panel, so flatten it back to a card sitting in the container.
       chapter sets these three inline, so overriding them needs !important. */
    [data-chapter-admin] > div:has(.cl-rootBox) {
      min-height: 0 !important;
      padding: 0 !important;
      background: none !important;
    }

    /* ── Loading (the page's own pre-console spinner) ── */
    @keyframes ssc-spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: ssc-spin 0.7s linear infinite;
      vertical-align: -3px;
    }

    .hidden { display: none; }

    @media (max-width: 480px) {
      .hero { padding: 48px 24px 40px; }
      .back-link { position: static; display: block; text-align: left; margin-bottom: 20px; }
      .card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <div class="hero">
    <a href="/members/" class="back-link">← Member area</a>
    <div class="wordmark">Silver <span class="brand-amp">&amp;</span> Salt Capital</div>
    <h1>Admin Console</h1>
    <span class="tag">Internal</span>
  </div>

  <div class="container">

    <!-- @odla-ai/chapter's ChapterAdmin renders here (src/app/admin.jsx). It
         owns the whole signed-out path too: it fetches the Clerk publishable
         key from /api/config, mounts the sign-in widget, and gates on the
         admin role, so this page stages no loading or sign-in markup. -->
    <div id="console-root"></div>

  </div>

  <script type="module" src="/assets/app/admin.js?v=21"></script>
</body>
</html>
