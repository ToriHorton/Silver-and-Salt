# Deploy the site to the Cloudflare Worker on every push to main.
#
# WHY THIS EXISTS. Until the DNS cutover, GitHub Pages published the site
# straight from the main branch, so a push WAS a deploy. Once
# silverandsaltcapital.com points at the Worker, Pages no longer serves the
# domain, and a push does nothing until someone runs wrangler by hand. This
# closes that gap so the live site keeps tracking main.
#
# SAFETY. This deploys the TOP-LEVEL (production) wrangler config only. It must
# never run `--env dev`: the dev environment shares the dev tenant with other
# branches and other machines. The dev Worker stays a manual
# `npm run deploy:app:dev`.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      # Private CEO tooling and its feeds. The daily dashboard routine commits
      # these to main, and none of them reach the build, so redeploying for
      # them would burn a run to change nothing.
      - 'hq-*.html'
      - 'granola-inbox.js'
      - 'newsletter-data.js'
      - 'goals.js'
      - 'goals.json'
      - 'deploy-stamp.txt'
      - 'deploy-dashboard.sh'
      - '_scripts/publish-dashboard.sh'
      - '_scripts/commit-dashboard-work.sh'
      # Documentation that is excluded from the build.
      - '**/*.md'
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

# One deploy at a time. Two pushes in quick succession should not race to
# upload assets to the same Worker.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned by .nvmrc (24.13.0), matching package.json engines; the
          # launch dependency checkpoint of 2026-09-14 qualified on that line.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Gate the deploy on the suites. A red parity test means the composed
      # schema drifted from the frozen contract, which is exactly the kind of
      # change that should never reach production unreviewed.
      - name: Test
        run: npm test

      # Builds dist/ from the reachability manifest (_scripts/site-manifest.mjs:
      # only files the entry pages link to), then bundles the Preact islands.
      - name: Build
        run: npm run build

      # Fail loudly rather than silently shipping an empty site if the build
      # ever produces nothing useful.
      - name: Sanity-check the build
        run: |
          for page in index.html 404.html join.html membership.html admin/index.html members/index.html assets/app/join-island.js version.txt; do
            test -f "dist/$page" || { echo "dist/$page missing"; exit 1; }
          done
          count=$(find dist -type f | wc -l | tr -d ' ')
          echo "dist contains $count files"
          # The manifest build ships about 75 files (2026-09-15). Well under
          # that means a page tree or asset folder failed to copy.
          [ "$count" -ge 50 ] || { echo "suspiciously small build"; exit 1; }
          for leaked in hq-25b5a94e297e.html goals.json MIGRATION.md PAYMENT-SPEC.md LEGAL-REVIEW-HOW-IT-WORKS.md; do
            [ -e "dist/$leaked" ] && { echo "private file reached the build: $leaked"; exit 1; }
          done
          echo "no private file in the build"

      # Retried on purpose. On 2026-09-10 the assets uploaded fine and the
      # final POST that ACTIVATES the new version came back 503 from the
      # Cloudflare API. The run went red, the site stayed up on the previous
      # version, and the stale copy looked like an editing mistake for
      # twenty minutes. Deploying is idempotent (each attempt just creates a
      # version), so a transient API error should cost seconds, not a day.
      #
      # Raw wrangler rather than cloudflare/wrangler-action, which has no
      # retry. wrangler is pinned in devDependencies and installed by npm ci,
      # so `npx` runs that exact version, never a floating download.
      #
      # SAFETY: bare `deploy`, never `--env dev`. See the header of this file
      # and the ROUTE GUARD comment in wrangler.jsonc.
      # Fail closed before anything is uploaded: the token must see exactly
      # one Cloudflare account (Tori's), the production Worker must already
      # hold its ODLA_API_KEY secret, and wrangler.jsonc must still describe
      # the production identity with sales closed by default. Names only;
      # no secret value is ever read.
      - name: Assert the production deploy target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node _scripts/assert-prod-deploy-target.mjs

      # Optional candidate gate. When the repository variable
      # SILVER_STAGING_URL names a deployed staging candidate, prove that it
      # serves the production identity with sales closed before promoting
      # the same commit to the domain.
      - name: Probe the staging candidate
        if: ${{ vars.SILVER_STAGING_URL != '' }}
        run: |
          set -e
          base="${{ vars.SILVER_STAGING_URL }}"
          config=$(curl -fsS "$base/api/config")
          echo "$config"
          echo "$config" | grep -q '"env":"prod"' || { echo "::error::staging is not a prod-identity candidate"; exit 1; }
          echo "$config" | grep -q '"clerkPublishableKey":"pk_live_' || { echo "::error::staging serves no live Clerk key"; exit 1; }
          sales=$(curl -fsS "$base/api/sales-state")
          echo "$sales"
          echo "$sales" | grep -q '"state":"disabled"' || { echo "::error::staging sales are not disabled"; exit 1; }

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::wrangler deploy (attempt $attempt of 3)"
            if npx wrangler deploy; then
              echo "::endgroup::"
              echo "deployed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          echo "::error::wrangler deploy failed three times"
          exit 1

      # The step that would have caught the 2026-09-10 stale deploy. A green
      # wrangler run only means the API accepted the call; it does not mean
      # the edge is serving the new build. Ask the live domain what commit it
      # is running and refuse to call the deploy done until it answers with
      # this one.
      #
      # Do not "fix" a red result here by deleting this step. Red means the
      # live site is genuinely serving something other than main.
      - name: Verify the live site is serving this commit
        run: |
          expected="$GITHUB_SHA"
          url="https://silverandsaltcapital.com/version.txt"
          for attempt in $(seq 1 20); do
            live=$(curl -fsS --max-time 10 "$url?cb=$(date +%s%N)" | tr -d '[:space:]' || true)
            if [ "$live" = "$expected" ]; then
              echo "live site is serving $expected (after $attempt check(s))"
              exit 0
            fi
            echo "check $attempt: live=${live:-<unreachable>} expected=$expected"
            sleep 15
          done
          echo "::error::silverandsaltcapital.com is not serving $expected after ~5 minutes. The deploy reported success but the live site is stale. Re-run this workflow; if it fails again, check the Cloudflare dashboard for the Worker silver-and-salt-capital."
          exit 1

  # Deploy failures used to be silent: the site simply kept serving the old
  # version, with nothing in the repo to say so. This leaves a visible record
  # that someone has to close.
  report-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The live site may be serving an older version than main."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Failed run: $RUN_URL"
            echo
            echo "**Check whether the live site is stale**"
            echo
            echo '```'
            echo 'curl -s https://silverandsaltcapital.com/version.txt'
            echo '```'
            echo
            echo "If that does not match \`git rev-parse origin/main\`, the live site"
            echo "is stale. Most failures here are transient Cloudflare API errors, so"
            echo "re-running the failed run is the first thing to try."
            echo
            echo "Close this issue once the live site matches main."
          } > body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Deploy to Cloudflare failed for ${GITHUB_SHA:0:7}" \
            --body-file body.md
